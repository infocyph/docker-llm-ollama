name: CLI Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Bash CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate CLI
        run: |
          bash -n scripts/llm-sm scripts/lib/*.sh scripts/commands/*.sh
          shellcheck -x scripts/llm-sm scripts/lib/*.sh scripts/commands/*.sh
          test ! -e scripts/commands/install.sh
          test ! -e scripts/commands/uninstall.sh

      - name: Validate Compose examples
        run: |
          docker compose -f compose.yml config >/dev/null
          docker compose -f examples/compose/cpu.yml config >/dev/null
          docker compose -f examples/compose/nvidia.yml config >/dev/null
          docker compose -f examples/compose/amd.yml config >/dev/null

      - name: Smoke test repository CLI
        run: |
          ./scripts/llm-sm help >/dev/null
          ./scripts/llm-sm ai-commit --help >/dev/null
          ./scripts/llm-sm version | grep -q '^llm-sm 0.4.0$'
          test -s scripts/prompts/ai-commit.txt

      - name: Smoke test bundled image layout
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/usr/local/bin" "$root/usr/local/lib/llm-sm"
          cp scripts/llm-sm "$root/usr/local/bin/llm-sm"
          cp -R scripts/lib scripts/commands scripts/prompts "$root/usr/local/lib/llm-sm/"
          chmod 0755 "$root/usr/local/bin/llm-sm"

          "$root/usr/local/bin/llm-sm" help >/dev/null
          "$root/usr/local/bin/llm-sm" ai-commit --help >/dev/null
          "$root/usr/local/bin/llm-sm" version | grep -q '^llm-sm 0.4.0$'
          test -s "$root/usr/local/lib/llm-sm/prompts/ai-commit.txt"
