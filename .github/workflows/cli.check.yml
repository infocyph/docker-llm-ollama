name: CLI Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Bash CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Bash syntax
        run: bash -n scripts/llm-sm scripts/lib/*.sh scripts/commands/*.sh

      - name: Run ShellCheck
        run: shellcheck -x scripts/llm-sm scripts/lib/*.sh scripts/commands/*.sh

      - name: Smoke test repository CLI
        run: |
          ./scripts/llm-sm help >/dev/null
          ./scripts/llm-sm version | grep -q '^llm-sm 0.2.0$'

      - name: Smoke test installed CLI
        run: |
          tmp="$(mktemp -d)"
          ./scripts/llm-sm install "$tmp/bin"
          "$tmp/bin/llm-sm" help >/dev/null
          "$tmp/bin/llm-sm" version | grep -q '^llm-sm 0.2.0$'
          "$tmp/bin/llm-sm" install "$tmp/bin"
          "$tmp/bin/llm-sm" uninstall "$tmp/bin"
          test ! -e "$tmp/bin/llm-sm"
          test ! -d "$tmp/lib/llm-sm"
