name: CLI Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Bash CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate CLI
        run: |
          bash -n scripts/llm-sm scripts/lib/*.sh scripts/commands/*.sh
          shellcheck -x scripts/llm-sm scripts/lib/*.sh scripts/commands/*.sh

      - name: Validate Compose examples
        run: |
          docker compose -f compose.yml config >/dev/null
          docker compose -f examples/compose/cpu.yml config >/dev/null
          docker compose -f examples/compose/nvidia.yml config >/dev/null
          docker compose -f examples/compose/amd.yml config >/dev/null

      - name: Smoke test repository CLI
        run: |
          ./scripts/llm-sm help >/dev/null
          ./scripts/llm-sm ai-commit --help >/dev/null
          ./scripts/llm-sm version | grep -q '^llm-sm 0.3.0$'
          test -s scripts/prompts/ai-commit.txt

      - name: Smoke test installed CLI
        run: |
          tmp="$(mktemp -d)"
          ./scripts/llm-sm install "$tmp/bin"
          "$tmp/bin/llm-sm" help >/dev/null
          "$tmp/bin/llm-sm" ai-commit --help >/dev/null
          "$tmp/bin/llm-sm" version | grep -q '^llm-sm 0.3.0$'
          test -s "$tmp/lib/llm-sm/prompts/ai-commit.txt"
          "$tmp/bin/llm-sm" install "$tmp/bin"
          "$tmp/bin/llm-sm" uninstall "$tmp/bin"
          test ! -e "$tmp/bin/llm-sm"
          test ! -d "$tmp/lib/llm-sm"
