name: Runtime Check

on:
  pull_request:
    paths:
      - Dockerfile
      - 'scripts/**'
      - 'compose*.yml'
      - 'examples/compose/**'
      - .github/workflows/runtime.check.yml
      - .github/workflows/docker.publish.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - 'scripts/**'
      - 'compose*.yml'
      - 'examples/compose/**'
      - .github/workflows/runtime.check.yml
      - .github/workflows/docker.publish.yml
  workflow_dispatch:
    inputs:
      model:
        description: Model to bake and validate
        required: false
        default: qwen3.5:9b
        type: string
  workflow_call:
    inputs:
      model:
        description: Model to bake and validate
        required: false
        default: qwen3.5:9b
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    name: Standard runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: llm-ollama:runtime-smoke
          build-args: |
            OLLAMA_BASE_IMAGE=ollama/ollama:latest
            OLLAMA_MODEL=${{ inputs.model || 'qwen3.5:9b' }}
            LLM_OLLAMA_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=runtime-standard
          cache-to: type=gha,mode=max,scope=runtime-standard

      - name: Run runtime smoke
        env:
          OLLAMA_MODEL: ${{ inputs.model || 'qwen3.5:9b' }}
        run: bash scripts/ci/runtime-smoke.sh llm-ollama:runtime-smoke
