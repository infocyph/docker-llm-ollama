services:
  llm-sm:
    image: ${LLM_SM_IMAGE:-infocyph/llm-ollama:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - llm-sm-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-1}
      LLM_SM_MODEL: ${LLM_SM_MODEL:-}
      LLM_SM_SYSTEM: ${LLM_SM_SYSTEM:-}
      LLM_SM_INPUT_WARN_BYTES: ${LLM_SM_INPUT_WARN_BYTES:-1048576}
      LLM_SM_INPUT_MAX_BYTES: ${LLM_SM_INPUT_MAX_BYTES:-0}
      LLM_SM_ATTACHMENT_MAX_BYTES: ${LLM_SM_ATTACHMENT_MAX_BYTES:-16777216}
      LLM_SM_ATTACHMENTS_MAX_BYTES: ${LLM_SM_ATTACHMENTS_MAX_BYTES:-33554432}
      LLM_SM_ATTACHMENT_MAX_COUNT: ${LLM_SM_ATTACHMENT_MAX_COUNT:-16}
      LLM_SM_PDF_MAX_PAGES: ${LLM_SM_PDF_MAX_PAGES:-24}
      LLM_SM_PDF_DPI: ${LLM_SM_PDF_DPI:-120}
      LLM_SM_ALLOW_LARGE_INPUT: ${LLM_SM_ALLOW_LARGE_INPUT:-0}

volumes:
  llm-sm-data:
    name: ${LLM_SM_VOLUME:-llm-sm-data}
