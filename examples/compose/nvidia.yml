services:
  llm-ollama:
    image: ${LLM_OLLAMA_IMAGE:-infocyph/llm-ollama:latest}
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - llm-ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-1}
      LLM_OLLAMA_MODEL: ${LLM_OLLAMA_MODEL:-}
      LLM_OLLAMA_SYSTEM: ${LLM_OLLAMA_SYSTEM:-}
      LLM_THINK: ${LLM_THINK:-}
      LLM_OLLAMA_INPUT_WARN_BYTES: ${LLM_OLLAMA_INPUT_WARN_BYTES:-1048576}
      LLM_OLLAMA_INPUT_MAX_BYTES: ${LLM_OLLAMA_INPUT_MAX_BYTES:-0}
      LLM_OLLAMA_ATTACHMENT_MAX_BYTES: ${LLM_OLLAMA_ATTACHMENT_MAX_BYTES:-16777216}
      LLM_OLLAMA_ATTACHMENTS_MAX_BYTES: ${LLM_OLLAMA_ATTACHMENTS_MAX_BYTES:-33554432}
      LLM_OLLAMA_ATTACHMENT_MAX_COUNT: ${LLM_OLLAMA_ATTACHMENT_MAX_COUNT:-16}
      LLM_OLLAMA_PDF_MAX_PAGES: ${LLM_OLLAMA_PDF_MAX_PAGES:-24}
      LLM_OLLAMA_PDF_DPI: ${LLM_OLLAMA_PDF_DPI:-120}
      LLM_OLLAMA_ALLOW_LARGE_INPUT: ${LLM_OLLAMA_ALLOW_LARGE_INPUT:-0}

volumes:
  llm-ollama-data:
    name: ${LLM_OLLAMA_VOLUME:-llm-ollama-data}
